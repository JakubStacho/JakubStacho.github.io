baseURL = 'https://example.org/'
locale = 'en-us'
title = 'Jakub Stacho'
theme = 'pico-corp'

[[menu.main]]
  name = 'Home'
  pageRef = '/'
  weight = 0
[[menu.main]]
  name = 'Projects'
  pageRef = '/projects'
  weight = 10
[[menu.main]]
  name = 'Publications'
